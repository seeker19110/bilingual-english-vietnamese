# Nginx Cache-Control Configuration for Production
# File: /etc/nginx/conf.d/cache-headers.conf

# Cache files có hash (immutable) - 1 năm.
# LƯU Ý: Vite đặt tên "[name]-[hash:8].ext" (vd: chunk-009-kqpwuI8u.js) — hash là
# base64url 8 ký tự (A-Za-z0-9_-) đứng SAU dấu '-', KHÔNG phải hex sau dấu '.',
# và JS nằm trong /js/ (không phải /assets/). Regex cũ /\.[a-f0-9]{8}\./ + /assets/
# không bao giờ khớp → toàn bộ JS/CSS không được cache immutable.
location ~* -[A-Za-z0-9_-]{8}\.(js|css|woff2?|png|jpe?g|gif|svg|webp)$ {
  expires 365d;
  add_header Cache-Control "public, immutable";
  add_header Vary "Accept-Encoding";
}

# Cache index.html - không cache (luôn fetch mới)
location = /index.html {
  expires -1;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  add_header Pragma "no-cache";
  add_header Expires "0";
}

# Cache other HTML - 1 giờ
location ~* \.html$ {
  expires 1h;
  add_header Cache-Control "public, max-age=3600";
}

# API responses - không cache
location /api/ {
  expires -1;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# Gzip + Brotli compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

# Brotli (nếu module cài)
brotli on;
brotli_comp_level 6;
brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
