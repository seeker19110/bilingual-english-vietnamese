name: "💡 Feature discovery"
description: Nghiên cứu và viết đặc tả chi tiết trước khi code tính năng
title: "research: "
labels: ["type: feature", "status: discovery"]
body:
  - type: markdown
    attributes:
      value: |
        **Không code tính năng từ issue này khi chưa có spec được duyệt.**
        Tạo spec từ `docs/specs/TEMPLATE.md`, review và merge spec trước implementation.
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề và người dùng
      description: Ai gặp vấn đề gì, trong bối cảnh nào? Bằng chứng hiện có?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome và cách đo
      placeholder: Baseline..., mục tiêu..., guardrail...
    validations:
      required: true
  - type: textarea
    id: research
    attributes:
      label: Kế hoạch nghiên cứu
      description: Code/flow cần đọc, dữ liệu, nguồn chính thống, người dùng và giải pháp tương tự cần khảo sát.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Phương án cần so sánh
      description: Bao gồm phương án không làm, trade-off và tiêu chí quyết định.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope sơ bộ và non-goals
      placeholder: |
        In scope:
        - ...
        Không làm:
        - ...
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Mức rủi ro
      options:
        - Thấp — UI/logic cô lập
        - Vừa — API/data không nhạy cảm
        - Cao — auth/data/payment/usage/AI cost/production
    validations:
      required: true
  - type: textarea
    id: unknowns
    attributes:
      label: Giả định, điều chưa biết và quyết định cần chốt
    validations:
      required: true
  - type: checkboxes
    id: gate
    attributes:
      label: Cam kết cổng Spec
      options:
        - label: Chưa sửa source hoặc mở PR implementation trước khi research hoàn tất.
          required: true
        - label: Sẽ tạo `docs/specs/<yyyy-mm-dd>-<slug>.md` từ template.
          required: true
        - label: Chỉ bắt đầu code sau khi spec ghi Approved for implementation, người duyệt và ngày duyệt.
          required: true
