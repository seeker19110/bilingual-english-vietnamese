name: CI

# Cổng chất lượng: chạy trên MỌI pull request và mỗi lần push lên main.
# Chặn mã hỏng (lỗi type/lint/test/build) trước khi merge / trước khi deploy.yml chạy.
on:
  pull_request:
  push:
    branches: [main]

# Mỗi lần push mới lên một PR làm run của commit CŨ thành vô nghĩa, nhưng GitHub không tự
# huỷ chúng — để chúng chạy tiếp là đốt phút Actions cho một kết quả không ai đọc, vì thứ
# duy nhất branch protection nhìn là commit head. Thêm ở PR #703.
#
# KHÔNG phải bản vá cho vụ CI đứng im hôm 2026-08-26: vụ đó là sự cố Actions phía GitHub
# (major_outage), run kẹt trước cả hàng đợi nên huỷ cũng báo 409. Xem changelog 0165 —
# chẩn đoán đầu tiên quy nhầm cho chính chỗ thiếu này.
#
# cancel-in-progress CHỈ bật cho pull_request. Push lên main không bao giờ bị huỷ: lượt CI
# trên main là double-check trước khi deploy.yml chạy, huỷ nó là mất lưới an toàn cuối.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CẤU TRÚC (đổi 2026-08-27 — chia nhỏ để tăng tốc):
#   Trước: 2 job tuần tự dài (quality ~9 bước nối đuôi, e2e 1 worker chạy hết ~180 test).
#   Nay:   các bước con chạy SONG SONG trên nhiều runner, rồi hai job TỔNG HỢP tên
#          `quality` và `e2e` gom kết quả lại.
#   Tên `quality` / `e2e` PHẢI GIỮ NGUYÊN: đó là required status check của branch
#   protection nhánh main (xem CLAUDE.md mục 13.6). Đổi tên = auto-merge kẹt vĩnh viễn.
jobs:
  # ── Nhánh 1: type + lint + format (không cần build) ────────────────────────
  static:
    name: Type + Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # khớp engines trong package.json (>=22)
          cache: npm
      - run: npm ci

      - name: Typecheck (frontend + API)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

  # ── Nhánh 2: unit test + coverage gate ─────────────────────────────────────
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Unit tests + coverage gate
        run: npm run test:coverage

  # ── Nhánh 3: build + ngân sách bundle + boot check ─────────────────────────
  build:
    name: Build + budget + boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build
        run: npm run build

      # Ngân sách hiệu năng: chặn bundle JS/CSS phình to (đo brotli, không tệ hơn
      # hiện tại). Đo trên dist vừa build ở bước trên. Xem .size-limit.json.
      - name: Bundle size budget (size-limit)
        run: npm run size

      # Boot check: server đã biên dịch (dist-server, phân giải @dhcb qua dist từng gói —
      # phương án B project references) phải KHỞI ĐỘNG được thật và trả /api/health 200.
      # Bắt lỗi phân giải module lúc runtime mà typecheck không thấy (exports/paths lệch).
      - name: Boot check server đã biên dịch
        run: |
          PORT=3199 NODE_ENV=production \
          DATABASE_URL="postgres://fake:fake@127.0.0.1:5/fake" \
          TTS_ENCRYPTION_MASTER_KEY="$(head -c32 /dev/zero | base64)" \
          node dist-server/server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf http://127.0.0.1:3199/api/health > /dev/null; then
              echo "✅ /api/health OK"; kill $SERVER_PID; exit 0
            fi
          done
          echo "❌ Server không trả /api/health sau 20s"; kill $SERVER_PID || true; exit 1

  # ── Nhánh 4: cổng bảo mật + kiến trúc (nhẹ, chạy riêng cho nhanh) ──────────
  audit:
    name: npm audit + chu trình import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Gate bảo mật dependency: 0 lỗ hổng ở production deps (tiêu chuẩn N5, 2026-08-23).
      # devDependencies vá qua overrides trong package.json, không chặn ở đây.
      - name: npm audit (production deps, 0 lỗ hổng)
        run: npm audit --omit=dev

      # Gate kiến trúc: 0 chu trình import trong toàn repo (tiêu chuẩn N5, 2026-08-23).
      - name: Chu trình import (codemap cycles = 0)
        run: npm run codemap -- cycles | grep -q "Không có chu trình import"

  # ── Job TỔNG HỢP: đây là required status check `quality` ───────────────────
  quality:
    name: quality
    runs-on: ubuntu-latest
    needs: [static, unit, build, audit]
    if: ${{ !cancelled() }}
    steps:
      - name: Gom kết quả 4 nhánh
        run: |
          echo "static=${{ needs.static.result }}"
          echo "unit=${{ needs.unit.result }}"
          echo "build=${{ needs.build.result }}"
          echo "audit=${{ needs.audit.result }}"
          if [ "${{ needs.static.result }}" != "success" ] \
            || [ "${{ needs.unit.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ] \
            || [ "${{ needs.audit.result }}" != "success" ]; then
            echo "❌ Có nhánh chất lượng KHÔNG xanh"; exit 1
          fi
          echo "✅ Toàn bộ cổng chất lượng xanh"

  # ── E2E chia 4 mảnh chạy song song ─────────────────────────────────────────
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Trên CI không có Chromium cài sẵn → tự cài (playwright.config.ts sẽ tự
      # bỏ executablePath khi đường dẫn /opt/pw-browsers không tồn tại).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright + axe) — mảnh ${{ matrix.shard }}/4
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report (khi lỗi)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # ── Job TỔNG HỢP: đây là required status check `e2e` ───────────────────────
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [e2e-shard]
    if: ${{ !cancelled() }}
    steps:
      - name: Gom kết quả các mảnh E2E
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "❌ Có mảnh E2E KHÔNG xanh"; exit 1
          fi
          echo "✅ Toàn bộ 4 mảnh E2E xanh"
