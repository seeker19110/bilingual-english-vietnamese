name: CI

# Cổng chất lượng: chạy trên MỌI pull request và mỗi lần push lên main.
# Chặn mã hỏng (lỗi type/lint/test/build) trước khi merge / trước khi deploy.yml chạy.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # khớp engines trong package.json (>=22)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (frontend + API)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # khớp engines trong package.json (>=22)
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Trên CI không có Chromium cài sẵn → tự cài (playwright.config.ts sẽ tự
      # bỏ executablePath khi đường dẫn /opt/pw-browsers không tồn tại).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright + axe)
        run: npm run test:e2e

      - name: Upload Playwright report (khi lỗi)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
