name: CI

# Cổng chất lượng: chạy trên MỌI pull request và mỗi lần push lên main.
# Chặn mã hỏng (lỗi type/lint/test/build) trước khi merge / trước khi deploy.yml chạy.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # khớp engines trong package.json (>=22)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (frontend + API)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
