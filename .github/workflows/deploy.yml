name: Deploy to VPS

# Chỉ deploy SAU KHI workflow CI chạy xong và PASS trên main — tránh lặp lỗi
# đã xảy ra (PR #173: CI đỏ ở bước format:check nhưng deploy vẫn chạy vì trước
# đây trigger độc lập trên cùng sự kiện push, không phụ thuộc kết quả CI).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

# Nhiều lần push/merge lên main gần nhau → nhiều lần CI pass gần nhau → nhiều job deploy
# có thể được GitHub Actions chạy SONG SONG (mặc định không tự xếp hàng), cả 2 cùng SSH
# vào VPS pull/build/reload PM2 cùng lúc → đụng nhau. concurrency group ép các lần deploy
# XẾP HÀNG (cancel-in-progress: false = không huỷ lần đang chạy, lần sau đợi lần trước xong).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/english-tutor

            echo "📥 Pull code..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Install dependencies..."
            npm install

            echo "🗄️  Chạy migration Supabase còn thiếu..."
            npm run migrate

            echo "🔨 Build..."
            npm run build

            echo "🔄 Reload PM2 (graceful, hạn chế downtime)..."
            pm2 reload ecosystem.config.cjs

            echo "⏳ Chờ app sẵn sàng (health check có retry)..."
            for i in $(seq 1 15); do
              curl -fsS http://localhost:3001/api/health >/dev/null && { echo "✅ Deploy thành công — health OK (sau ${i}s)"; exit 0; }
              sleep 1
            done
            echo "⚠️  Health check failed sau 15s — app chưa phản hồi ở cổng 3001"
            exit 1
