name: Deploy to VPS

# Chỉ deploy SAU KHI workflow CI chạy xong và PASS trên main — tránh lặp lỗi
# đã xảy ra (PR #173: CI đỏ ở bước format:check nhưng deploy vẫn chạy vì trước
# đây trigger độc lập trên cùng sự kiện push, không phụ thuộc kết quả CI).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

# Nhiều lần push/merge lên main gần nhau → nhiều lần CI pass gần nhau → nhiều job deploy
# có thể được GitHub Actions chạy SONG SONG (mặc định không tự xếp hàng), cả 2 cùng SSH
# vào VPS pull/build/reload PM2 cùng lúc → đụng nhau. concurrency group ép các lần deploy
# XẾP HÀNG (cancel-in-progress: false = không huỷ lần đang chạy, lần sau đợi lần trước xong).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/english-tutor
            bash scripts/deploy.sh
