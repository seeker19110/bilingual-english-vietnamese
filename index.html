    <!-- JSON-LD Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Gia sư tiếng Anh AI",

        "price": "0",
        "priceCurrency": "VND"

    </script>
    <!-- FAQ Schema for search result snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Gia sư tiếng Anh AI có những tính năng gì?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Gia sư AI cung cấp 3 chế độ chính: (1) Chat tổng hợp - trò chuyện với AI, sửa lỗi, giải thích bằng tiếng Việt; (2) Luyện viết - chấm bài kiểu IELTS với phản hồi chi tiết; (3) Luyện nói - nói tiếng Anh, AI phản hồi bằng giọng Anh, sửa lỗi bằng giọng Việt. Cộng thêm: Học từ vựng theo lộ trình (20 từ/ngày), Lộ trình CEFR (A1→B2), Từ điển 7400+ từ, Bài học ngữ pháp."
          }
        },
        {
          "@type": "Question",
          "name": "Có bao nhiêu lượt dùng mỗi ngày?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Gói Free: 5 lượt chat + 5 lượt nói + 3 lượt viết/ngày. Gói Pro: unlimited. Lượt dùng reset mỗi ngày 00:00 UTC+7."
          }
        },
        {
          "@type": "Question",
          "name": "Có hỗ trợ ngoại ngữ nào khác ngoài tiếng Anh không?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Hiện tại chỉ hỗ trợ tiếng Anh và tiếng Việt. Người Việt có thể học tiếng Anh (chiều A) hoặc người nước ngoài có thể học tiếng Việt qua tiếng Anh (chiều B)."
          }
        },
        {
          "@type": "Question",
          "name": "Có cần đăng nhập không?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Có. Bạn cần đăng nhập bằng email để theo dõi tiến độ, lưu lịch sử, và quản lý gói cước. Đăng nhập hoàn toàn miễn phí qua Supabase Auth."
          }
        },
        {
          "@type": "Question",
          "name": "Dữ liệu của tôi an toàn như thế nào?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dữ liệu được lưu trên Supabase (PostgreSQL) với Row-Level Security (RLS). Chat, viết, nói, và thống kê lượt dùng được mã hóa và chỉ bạn mới có quyền truy cập. Audio được cache mã hóa AES-256-GCM."
          }
        }
      ]
    }
    </script>
