# Nginx config cho en-vi.donghanhcungban.com
# Copy lên VPS: sudo cp nginx/en-vi.conf /etc/nginx/sites-available/en-vi
# Rồi: sudo nginx -t && sudo systemctl reload nginx
#
# Chiến lược cache:
#   - /js/, /assets/ → Nginx serve trực tiếp từ dist/ (bypass Express hoàn toàn)
#     File có hash trong tên → cache immutable 1 năm
#   - /uploads/      → Nginx serve trực tiếp từ uploads/ (file audio TTS)
#   - /api/          → proxy về Express (Node.js xử lý)
#   - /index.html    → proxy Express, NO cache (luôn lấy bản mới sau deploy)

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name en-vi.donghanhcungban.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# ── HTTPS + HTTP/2 ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name en-vi.donghanhcungban.com;
    server_tokens off;

    client_max_body_size 10M;

    # SSL (Certbot tự thêm; sau certbot nhớ thêm lại "http2" vào dòng listen)
    ssl_certificate /etc/letsencrypt/live/en-vi.donghanhcungban.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/en-vi.donghanhcungban.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Thư mục gốc của React build — Nginx đọc file từ đây cho /js/, /assets/
    root /var/www/english-tutor/dist;

    # ── Tối ưu file I/O ───────────────────────────────────────────────────────
    # Cache metadata file (inode, size, mtime) trong RAM: Nginx khỏi stat() mỗi request
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Phục vụ file .gz/.br đã nén sẵn (Vite build tạo ra) trước khi gzip on-the-fly
    gzip_static on;

    # ── /js/ và /assets/ — static files có hash, bypass Express hoàn toàn ─────
    # Vite đặt tên: chunk-XXXXXXXX.js / name-XXXXXXXX.css → hash bảo đảm tên thay đổi
    # khi code thay đổi → an toàn để cache mãi mãi (immutable).
    location ~* ^/(js|assets)/ {
        # Nginx đọc thẳng từ /var/www/english-tutor/dist/js/ và /dist/assets/
        # Không qua Express → TTFB cực thấp, không tốn RAM Node.js
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";

        # Bật sendfile để kernel copy trực tiếp file → network socket (zero-copy)
        sendfile on;
        tcp_nopush on;

        # Tắt access log cho static (giảm I/O ổ cứng)
        access_log off;
    }

    # ── /uploads/ — file audio TTS ────────────────────────────────────────────
    location /uploads/ {
        alias /var/www/english-tutor/uploads/;
        add_header Cache-Control "public, max-age=2592000";  # 30 ngày
        add_header Access-Control-Allow-Origin "*";
        add_header Vary "Accept-Encoding";
        sendfile on;
        tcp_nopush on;
        access_log off;
    }

    # ── /favicon.ico, /robots.txt, /manifest.json — cache 1 tuần ────────────
    location ~* \.(ico|txt|webmanifest|json)$ {
        try_files $uri @express;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ── /api/ — proxy về Express (Node.js) ───────────────────────────────────
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout cho API dài hơi (TTS/STT)
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── / (tất cả còn lại) — index.html KHÔNG cache ──────────────────────────
    # React Router xử lý routing phía client. index.html KHÔNG được cache:
    # sau mỗi deploy, tên chunk JS thay đổi → index.html cũ trỏ vào chunk đã biến mất
    # → màn hình trắng.
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Fallback: nếu try_files không tìm thấy file tĩnh thì chạy Express
    location @express {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
