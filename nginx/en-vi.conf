# Nginx config cho www.donghanhcungban.org (Tất cả domain khác 301 redirect về www.donghanhcungban.org)
# Copy lên VPS: sudo cp nginx/en-vi.conf /etc/nginx/sites-available/donghanhcungban
# Rồi: sudo ln -sf /etc/nginx/sites-available/donghanhcungban /etc/nginx/sites-enabled/
# Và: sudo nginx -t && sudo systemctl reload nginx
#
# NẾU dùng Cloudflare trước VPS (xem docs/cloudflare-setup.md): dòng "include
# /etc/nginx/cloudflare-realip.conf" bên dưới BẮT BUỘC phải có file đó tồn tại
# trước (chạy scripts/update-cloudflare-ips.sh 1 lần), nếu không "nginx -t" sẽ
# lỗi. Chưa dùng Cloudflare thì COMMENT dòng include đó lại.
#
# Chiến lược cache:
#   - /js/, /assets/ → Nginx serve trực tiếp từ dist/ (bypass Express hoàn toàn)
#     File có hash trong tên → cache immutable 1 năm
#   - /uploads/      → Nginx serve trực tiếp từ uploads/ (file audio TTS)
#   - /api/          → proxy về Express (Node.js xử lý)
#   - /index.html    → proxy Express, NO cache (luôn lấy bản mới sau deploy)

# ── 1. HTTP (Port 80) → HTTPS Canonical (Tất cả HTTP về https://www.donghanhcungban.org) ─────
server {
    listen 80;
    server_name www.donghanhcungban.org donghanhcungban.org en-vi.donghanhcungban.org www.donghanhcungban.com donghanhcungban.com en-vi.donghanhcungban.com;
    server_tokens off;
    return 301 https://www.donghanhcungban.org$request_uri;
}

# ── 2. HTTPS (Port 443) → Canonical HTTPS Redirect (Chuyển hướng toàn bộ domain phụ về www.donghanhcungban.org) ──
server {
    listen 443 ssl http2;
    server_name donghanhcungban.org en-vi.donghanhcungban.org www.donghanhcungban.com donghanhcungban.com en-vi.donghanhcungban.com;
    server_tokens off;

    # SSL Certbot (dùng chung chứng chỉ đã cấp cho các domain)
    ssl_certificate /etc/letsencrypt/live/donghanhcungban.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donghanhcungban.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.donghanhcungban.org$request_uri;
}

# ── 3. HTTPS Canonical Primary Server (Phục vụ chính tại https://www.donghanhcungban.org) ─────
server {
    listen 443 ssl http2;
    server_name www.donghanhcungban.org;
    server_tokens off;

    client_max_body_size 10M;

    # ── Cloudflare: chỉ tin IP thật của trình duyệt khi request đến từ Cloudflare ──
    include /etc/nginx/cloudflare-realip.conf;

    # SSL Certbot
    ssl_certificate /etc/letsencrypt/live/donghanhcungban.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donghanhcungban.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Thư mục gốc của React build — Nginx đọc file từ đây cho /js/, /assets/
    root /var/www/dhcb/dist;

    # ── CSP (Report-Only trước) ──
    add_header Content-Security-Policy-Report-Only "default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: https://*.supabase.co; style-src 'self' 'unsafe-inline' https://accounts.google.com; script-src 'self' https://static.cloudflareinsights.com https://accounts.google.com; font-src 'self'; frame-ancestors 'self'" always;

    # ── Tối ưu file I/O ───────────────────────────────────────────────────────
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Phục vụ file .gz/.br đã nén sẵn (Vite build tạo ra) trước khi gzip on-the-fly
    gzip_static on;

    # ── /js/ và /assets/ — static files có hash, bypass Express hoàn toàn ─────
    location ~* ^/(js|assets)/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";

        sendfile on;
        tcp_nopush on;
        access_log off;
    }

    # ── /uploads/ — file audio TTS ────────────────────────────────────────────
    location /uploads/ {
        alias /var/www/dhcb/uploads/;
        add_header Cache-Control "public, max-age=2592000";  # 30 ngày
        add_header Access-Control-Allow-Origin "*";
        add_header Vary "Accept-Encoding";
        sendfile on;
        tcp_nopush on;
        access_log off;
    }

    # ── /favicon.ico, /robots.txt, /manifest.json — cache 1 tuần ────────────
    location ~* \.(ico|txt|webmanifest|json)$ {
        try_files $uri @express;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ── /api/ — proxy về Express (Node.js) ───────────────────────────────────
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── / (tất cả còn lại) — index.html KHÔNG cache ──────────────────────────
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Fallback: nếu try_files không tìm thấy file tĩnh thì chạy Express
    location @express {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
