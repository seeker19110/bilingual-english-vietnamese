# /etc/nginx/sites-available/dhcb — cấu hình ĐANG CHẠY THẬT trên VPS (bản có điều hướng canonical).
#
# Domain chuẩn: https://www.donghanhcungban.org
#
#   PHỤC VỤ  : www.donghanhcungban.org · en-vi.donghanhcungban.org
#   301 → www: donghanhcungban.org (apex) · donghanhcungban.com · www.donghanhcungban.com
#   301 → en-vi.org: en-vi.donghanhcungban.com
#
# Cert /etc/letsencrypt/live/donghanhcungban.org/ phủ đủ cả 6 tên miền (xác nhận 2026-08-24:
# cả 6 đều bắt tay TLS thành công). Kiểm lại: sudo certbot certificates

# ── HTTP :80 — domain PHỤC VỤ: chỉ nâng lên HTTPS, GIỮ NGUYÊN host ──
server {
    listen 80;
    server_name www.donghanhcungban.org en-vi.donghanhcungban.org hub.donghanhcungban.org;
    return 301 https://$host$request_uri;
}

# ── HTTP :80 — domain KHÔNG chuẩn: đi thẳng tới HTTPS canonical (1 chặng, không phải 2) ──
server {
    listen 80;
    server_name donghanhcungban.org donghanhcungban.com www.donghanhcungban.com;
    return 301 https://www.donghanhcungban.org$request_uri;
}

server {
    listen 80;
    server_name en-vi.donghanhcungban.com;
    return 301 https://en-vi.donghanhcungban.org$request_uri;
}

# ── HTTPS :443 — apex + .com → www.donghanhcungban.org ──
server {
    listen 443 ssl http2;
    server_name donghanhcungban.org donghanhcungban.com www.donghanhcungban.com;

    ssl_certificate /etc/letsencrypt/live/donghanhcungban.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donghanhcungban.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.donghanhcungban.org$request_uri;
}

# ── HTTPS :443 — en-vi.com → en-vi.org (KHÔNG gom về hub: giữ đúng app người học đang dùng) ──
server {
    listen 443 ssl http2;
    server_name en-vi.donghanhcungban.com;

    ssl_certificate /etc/letsencrypt/live/donghanhcungban.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donghanhcungban.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://en-vi.donghanhcungban.org$request_uri;
}

# ── HUB: hub.donghanhcungban.org ────────────────────────────────────────────────────────────
# [2026-08-28] Landing giới thiệu nền tảng (`apps/hub`) nay có host riêng. KHÔNG cần block
# server riêng: block phục vụ bên dưới đã `proxy_set_header Host $host`, nên Express nhận đúng
# hostname và tự chọn `apps/hub/dist` (biến HUB_HOSTNAME, xem apps/server/src/server.ts).
# Việc TAY còn lại trên VPS, theo đúng thứ tự:
#   1. Cloudflare: thêm bản ghi A `hub` trỏ về IP VPS (người dùng tự làm).
#   2. Mở rộng chứng chỉ cho tên mới — cert hiện tại KHÔNG phủ `hub.`:
#        sudo certbot --nginx -d hub.donghanhcungban.org --expand
#      Chạy TRƯỚC khi reload với server_name mới, nếu không `nginx -t` sẽ than thiếu cert.
#   3. sudo nginx -t && sudo systemctl reload nginx

# ── HTTPS :443 — BLOCK PHỤC VỤ (nội dung giữ nguyên như bản trước, chỉ thu hẹp server_name) ──
server {
    listen 443 ssl http2;
    server_name www.donghanhcungban.org en-vi.donghanhcungban.org hub.donghanhcungban.org;
    client_max_body_size 10M;

    # Chứng chỉ SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/donghanhcungban.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donghanhcungban.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dhcb/dist;

    # File audio TTS
    location /uploads/ {
        alias /var/www/dhcb/uploads/;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
        sendfile on;
        access_log off;
    }

    # Chuyển tiếp về app Node.js / Express
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
